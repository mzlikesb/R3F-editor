name: 버그
description: 재현 가능한 문제 보고
labels: ['bug']
body:
  - type: textarea
    id: repro
    attributes:
      label: 재현
      description: 재현 순서
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 환경
      description: 기기, 브라우저, URL(Preview/staging/production), 커밋 SHA
    validations:
      required: true
